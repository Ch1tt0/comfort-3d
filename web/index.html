<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      *,*::before,*::after {
        sizing: border-box;
      }
      
      html {
        height: 100%;
        width: 100%;

        margin: 0;
      }
      
      body {
        height: 100%;
        width: 100%;

        margin: 0;
        
        background: linear-gradient(
            135deg,
            white 0%,
            white 49%,
            black 49%,
            black 51%,
            white 51%,
            white 100%
          )
          repeat;
        
        background-size: 20px 20px;
      }
      
      canvas {
        background-color: white;
      }
    </style>
    <title>Comfort 3D</title>
  </head>
  <body>
    <script type="module">
      import init from "./comfort-3d.js";
      init();
    </script>
    <script>
      (function () {
        // An array of all contexts to resume on the page.
        const audioContextList = [];
  
        // An array of various user interaction events we should listen for.
        const userInputEventNames = [
          "click",
          "contextmenu",
          "auxclick",
          "dblclick",
          "mousedown",
          "mouseup",
          "pointerup",
          "touchend",
          "keydown",
          "keyup",
        ];
  
        // A proxy object to intercept AudioContexts and add them to the array for tracking and resuming later.
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            const result = new target(...args);
            audioContextList.push(result);
            return result;
          },
        });
  
        // To resume all AudioContexts being tracked.
        function resumeAllContexts(event) {
          let count = 0;
  
          audioContextList.forEach((context) => {
            if (context.state !== "running") {
              context.resume();
            } else {
              count++;
            }
          });
  
          // If all the AudioContexts have now resumed then we unbind all the event listeners from the page to prevent unnecessary resume attempts.
          if (count == audioContextList.length) {
            userInputEventNames.forEach((eventName) => {
              document.removeEventListener(eventName, resumeAllContexts);
            });
          }
        }
  
        // We bind the resume function for each user interaction event on the page.
        userInputEventNames.forEach((eventName) => {
          document.addEventListener(eventName, resumeAllContexts);
        });
      })();
    </script>
  </body>
</html>
